<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bible</title>
  <meta name="description" content="Read, search, highlight and study the Bible — works offline.">
  <meta name="theme-color" content="#6b4f2a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/today" aria-label="Bible home">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Bible</span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="settings-btn" aria-label="Reading settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="action-bar" id="action-bar" hidden role="toolbar" aria-label="Selected verses">
    <div class="action-ref" id="action-ref"></div>
    <div class="swatches" role="group" aria-label="Highlight color">
      <button class="swatch" data-color="yellow" aria-label="Highlight yellow"></button>
      <button class="swatch" data-color="green" aria-label="Highlight green"></button>
      <button class="swatch" data-color="blue" aria-label="Highlight blue"></button>
      <button class="swatch" data-color="pink" aria-label="Highlight pink"></button>
      <button class="swatch" data-color="orange" aria-label="Highlight orange"></button>
      <button class="swatch swatch-clear" data-color="" aria-label="Remove highlight">✕</button>
    </div>
    <div class="actions">
      <button data-action="note">Note</button>
      <button data-action="bookmark">Bookmark</button>
      <button data-action="study" data-advanced>Study</button>
      <button data-action="share">Share</button>
      <button data-action="more" aria-haspopup="dialog">More…</button>
      <button data-action="clear" aria-label="Clear selection">Done</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
    <a href="#/read" data-tab="read"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5c3-1 7-1 10 1 3-2 7-2 10-1v14c-3-1-7-1-10 1-3-2-7-2-10-1z"/><path d="M12 6v14"/></svg><span>Read</span></a>
    <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><span>Search</span></a>
    <a href="#/study" data-tab="study" data-advanced><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-4a3 3 0 0 0-3 3"/><circle cx="17.5" cy="14.5" r="2.5"/><path d="M19.3 16.3L21 18"/></svg><span>Study</span></a>
    <a href="#/plans" data-tab="plans"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2 2 4-4"/></svg><span>Plans</span></a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Library</span></a>
  </nav>

  <dialog id="dialog"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
