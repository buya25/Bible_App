# Publishes the app to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js data icons vendor _site/
      - name: Stamp the release version (lets installed apps detect the update)
        run: |
          version="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${version}';/" _site/sw.js
          sed -i "s/^export const VERSION = 'dev';/export const VERSION = '${version}';/" _site/js/version.js
          grep -q "${version}" _site/sw.js && grep -q "${version}" _site/js/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
